# ==============================================================================
# Ultralytics YOLO Instance Segmentation / Polygon Configuration
# ==============================================================================

# Root directory of dataset
path: data

# Single master dataset list:
# - labels/yolo_seg/dataset.txt : All 912 CCCD cards (both front & back)
# - labels/yolo_seg/front.txt   : 648 Front cards only
# - labels/yolo_seg/back.txt    : 264 Back cards only
dataset: labels/yolo_seg/dataset.txt

# Dynamic validation split configuration (identical to DBNet)
val_ratio: 0.15
split_seed: 42

# Compatibility keys for Ultralytics parser
train: labels/yolo_seg/dataset.txt
val: labels/yolo_seg/dataset.txt

# 11 Standardized CCCD classes
nc: 11
names:
  0: id
  1: name
  2: dob
  3: gender
  4: nationality
  5: origin_place
  6: current_place
  7: expire_date
  8: issue_date
  9: features
  10: mrz
