[project]
name = "text-detection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.2",
    "onnx>=1.22.0",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pyclipper>=1.4.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "scikit-learn>=1.9.0",
    "shapely>=2.1.2",
    "timm>=1.0.28",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "tqdm>=4.70.0",
    "ultralytics>=8.4.142",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "tools"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

