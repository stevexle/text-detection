[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "text-detection"
version = "0.1.0"
description = "High-Performance Vietnamese Identity Card (CCCD) Text Detection and Document Classification Pipeline with DBNet and YOLO26"
readme = "README.md"
authors = [
    { name = "steve", email = "Ltien540@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "onnx>=1.14.0",
    "opencv-python-headless>=4.8.0",
    "pillow>=9.5.0",
    "pyclipper>=1.3.0",
    "pytest>=8.0.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
    "scikit-learn>=1.3.0",
    "shapely>=2.0.0",
    "timm>=0.9.0",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "tqdm>=4.66.0",
    "ultralytics>=8.2.0",
    "pi-heif>=0.14.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src", "tools"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu121", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cu121", marker = "sys_platform == 'linux'" },
]
